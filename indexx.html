<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My First Website</title>
  <style>
    /* CSS = Styling */
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      text-align: center;
      margin: 50px;
    }
    h1 {
      color: darkblue;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- HTML = Structure -->
  <h1>Hello, World! 👋</h1>
  <p>Welcome to my first website demo.</p>
  
  <button onclick="sayHello()">Click Me</button>

  <p id="message"></p>

  <!-- JavaScript = Behavior -->
  <script>
    function sayHello() {
      document.getElementById("message").innerText = "You clicked the button! 🚀";
    }
  </script>
</body>
</html>
